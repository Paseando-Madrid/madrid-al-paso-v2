name: Update Expo (Daily)

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC (diario)
  workflow_dispatch:

jobs:
  update-expo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install node-fetch@3 fast-xml-parser@4

      - name: Run updater
        run: node scripts/update-expo.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/agenda-monthly.json
          git diff --cached --quiet || git commit -m "Update Expo (auto)"
          git push
