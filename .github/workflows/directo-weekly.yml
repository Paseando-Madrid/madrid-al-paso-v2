name: Update En Directo (Weekly)

on:
  schedule:
    - cron: '0 6 * * 1' # Lunes 06:00 (hora GitHub/UTC)
  workflow_dispatch:

jobs:
  update-directo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install node-fetch@3

      - name: Run updater
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/update-directo.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/directo-weekly.json
          git diff --cached --quiet || git commit -m "Update En Directo (weekly)"
          git push
