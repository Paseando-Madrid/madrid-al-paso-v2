name: Update Ninos (Weekly)

on:
  schedule:
    - cron: '0 7 * * 1' # Lunes 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run updater
        run: node scripts/update-ninos-weekly.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/ninos-weekly.json
          git diff --staged --quiet || git commit -m "Update ninos weekly"
          git push
